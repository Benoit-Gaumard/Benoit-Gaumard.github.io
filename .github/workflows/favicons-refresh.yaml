name: Refresh cached favicons

# Third-party favicons are cached into /favicons/ so visitors never request them
# from Google. This keeps that cache current as links are added or removed:
# it only downloads domains that are new or missing, so a normal run is cheap.
#
# Run after catalogue changes and weekly to retry missing icons.
# Use redownload via workflow_dispatch when an existing icon has changed.

on:
  push:
    branches: [main]
    paths:
      - 'friends-websites/websites-meta.json'
      - 'favorite-links/favorite-links.csv'
      - 'microsoft-portals/portals-urls.csv'
      - 'build-favicons.mjs'
  workflow_run:
    workflows: ["Fold Community Submissions"]
    types: [completed]
  schedule:
    # Sunday 04:00 UTC, well clear of the data refresh workflows
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      redownload:
        description: 'Re-download every icon, not just missing ones'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: favicons-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh favicon cache
        run: |
          if [ "${{ inputs.redownload }}" = "true" ]; then
            node build-favicons.mjs --all
          else
            node build-favicons.mjs
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add favicons
          if git diff --cached --quiet; then
            echo "No favicon changes."
          else
            git commit -m "chore: refresh cached favicons"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              if git push origin HEAD:main; then exit 0; fi
              sleep 5
            done
            echo "::error::Could not publish the favicon cache after three attempts."
            exit 1
          fi
