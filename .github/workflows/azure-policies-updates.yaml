name: Refresh Azure Policies

on:
  schedule:
    # 06:00 and 09:00 and 12:00 and 15:00 UTC (4 times daily)
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'
    - cron: '0 12 * * *'
    - cron: '0 15 * * *'
    # Weekly dated snapshot (Monday 18:00 UTC, outside the daily refresh times above) to track new policies over time
    - cron: '0 18 * * 1'
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Also save a dated snapshot (normally only done on the weekly schedule)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: azure-policies-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest Azure Policies
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: ./azure-policies/fetch-updates.ps1

      - name: Save weekly dated snapshot
        if: github.event.schedule == '0 18 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.snapshot)
        # policyrules.json is deliberately not snapshotted: at ~10 MB a weekly
        # copy would add half a gigabyte to the repository every year, and the
        # index files are what the catalog diffs are actually read from.
        run: |
          mkdir -p azure-policies/history
          snapshot_date=$(date -u +%Y-%m-%d)
          cp azure-policies/policydefinitions.json "azure-policies/history/policydefinitions-${snapshot_date}.json"
          cp azure-policies/policysetdefinitions.json "azure-policies/history/policysetdefinitions-${snapshot_date}.json"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add azure-policies/policydefinitions.json azure-policies/policysetdefinitions.json azure-policies/policyrules.json
          if [ -d azure-policies/history ]; then
            git add azure-policies/history
          fi
          if git diff --cached --quiet; then
            echo "No changes to Azure Policies data."
          else
            git commit -m "chore: refresh Azure Policies data"
            git push
          fi
