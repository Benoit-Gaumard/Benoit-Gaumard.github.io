name: Refresh Azure IP Ranges

on:
  schedule:
    # 06:00 UTC (once daily, in the morning)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: azure-ip-ranges-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest Azure IP ranges (if a new file was published)
        run: node azure-ip-ranges/fetch-updates.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- azure-ip-ranges/ip-ranges.json; then
            echo "No changes to Azure IP ranges data."
          else
            git add azure-ip-ranges/ip-ranges.json
            git commit -m "chore: refresh Azure IP Ranges data"
            git push
          fi
