name: Refresh RSS Watcher Updates

on:
  schedule:
    # 06:00 UTC (once daily, in the morning)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rss-updates-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest RSS feeds
        run: node rss-watcher/fetch-updates.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- rss-watcher/updates.json rss-watcher/feed.en.xml rss-watcher/feed.fr.xml rss-watcher/feeds-status.json rss-watcher/feeds-meta.json; then
            echo "No changes to RSS Watcher data."
          else
            git add rss-watcher/updates.json rss-watcher/feed.en.xml rss-watcher/feed.fr.xml rss-watcher/feeds-status.json rss-watcher/feeds-meta.json
            git commit -m "chore: refresh RSS Watcher data"
            git push
          fi
