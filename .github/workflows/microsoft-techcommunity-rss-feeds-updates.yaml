name: Refresh Microsoft Tech Community RSS Feeds

on:
  schedule:
    # 06:00 UTC (once daily, in the morning)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: microsoft-techcommunity-rss-feeds-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest Microsoft Tech Community RSS feed status
        run: node microsoft-techcommunity-rss-feeds/fetch-updates.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- microsoft-techcommunity-rss-feeds/feeds-status.json; then
            echo "No changes to Microsoft Tech Community RSS feed status."
          else
            git add microsoft-techcommunity-rss-feeds/feeds-status.json
            git commit -m "chore: refresh Microsoft Tech Community RSS feed status"
            git push
          fi
