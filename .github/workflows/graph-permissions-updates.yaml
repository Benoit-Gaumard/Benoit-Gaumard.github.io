name: Refresh Microsoft Graph Permissions

on:
  schedule:
    # 06:00 and 09:00 and 12:00 and 15:00 UTC (4 times daily)
    - cron: '45 6 * * *'
    - cron: '45 9 * * *'
    - cron: '45 12 * * *'
    - cron: '45 15 * * *'
    # Weekly dated snapshot (Monday 18:45 UTC, outside the daily refresh times above) to track permission changes over time
    - cron: '45 18 * * 1'
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Also save a dated snapshot (normally only done on the weekly schedule)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: graph-permissions-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest Microsoft Graph permissions
        shell: pwsh
        env:
          # Only used to raise the GitHub API rate limit; the data itself comes
          # from public raw content.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./graph-permissions/fetch-updates.ps1

      - name: Save weekly dated snapshot
        if: github.event.schedule == '45 18 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.snapshot)
        run: |
          mkdir -p graph-permissions/history
          snapshot_date=$(date -u +%Y-%m-%d)
          cp graph-permissions/permissions.json "graph-permissions/history/permissions-${snapshot_date}.json"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add graph-permissions/permissions.json
          if [ -d graph-permissions/history ]; then
            git add graph-permissions/history
          fi
          if git diff --cached --quiet; then
            echo "No changes to Microsoft Graph permissions data."
          else
            git commit -m "chore: refresh Microsoft Graph permissions data"
            git push
          fi
