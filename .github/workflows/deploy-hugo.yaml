# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy site to GH Pages

on:
  push:
    branches:
      - main # Set a branch to deploy
  # Data-refresh workflows commit with the default GITHUB_TOKEN, which does NOT
  # trigger the push event above, so redeploy explicitly once they finish.
  workflow_run:
    workflows: ["Refresh Azure Release Updates", "Refresh M365 Release Updates", "Refresh RSS Watcher Updates", "Refresh GitHub IP Ranges", "Refresh Azure IP Ranges"]
    types: [completed]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    env:
      HUGO_VERSION: 0.140.0 #0.134.2
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: |
          DART_SASS_VERSION=1.83.0
          wget -O ${{ runner.temp }}/dart-sass.tar.gz "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -xzf ${{ runner.temp }}/dart-sass.tar.gz -C ${{ runner.temp }}
          echo "${{ runner.temp }}/dart-sass" >> "$GITHUB_PATH"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        working-directory: blog
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        working-directory: blog
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: UTC
        run: |
          rm -rf public
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/blog/" \
            --destination public/blog
          cp ../index.html public/index.html
          cp ../index_fr.html public/index_fr.html
          cp ../CNAME public/CNAME
          cp ../favicon.svg public/favicon.svg
          cp ../linkedin-photo.jpg public/linkedin-photo.jpg
          mkdir -p public/tools
          cp ../tools/index.html public/tools/index.html
          mkdir -p public/world-clock
          cp ../world-clock/index.html public/world-clock/index.html
          mkdir -p public/random-wheel
          cp ../random-wheel/index.html public/random-wheel/index.html
          mkdir -p public/units-converter
          cp ../units-converter/index.html public/units-converter/index.html
          mkdir -p public/sla-calculator
          cp ../sla-calculator/index.html public/sla-calculator/index.html
          mkdir -p public/workflows
          cp ../workflows/index.html public/workflows/index.html
          mkdir -p public/guid-generator
          cp ../guid-generator/index.html public/guid-generator/index.html
          mkdir -p public/subnet-calculator
          cp ../subnet-calculator/index.html public/subnet-calculator/index.html
          mkdir -p public/percentage-calculator
          cp ../percentage-calculator/index.html public/percentage-calculator/index.html
          mkdir -p public/github-ip-ranges
          cp ../github-ip-ranges/index.html public/github-ip-ranges/index.html
          cp ../github-ip-ranges/ip-ranges.json public/github-ip-ranges/ip-ranges.json
          mkdir -p public/azure-ip-ranges
          cp ../azure-ip-ranges/index.html public/azure-ip-ranges/index.html
          cp ../azure-ip-ranges/ip-ranges.json public/azure-ip-ranges/ip-ranges.json
          mkdir -p public/friends-websites
          cp ../friends-websites/index.html public/friends-websites/index.html
          cp ../friends-websites/friends-websites.csv public/friends-websites/friends-websites.csv
          cp ../friends-websites/websites-meta.json public/friends-websites/websites-meta.json
          mkdir -p public/rss-watcher
          cp ../rss-watcher/index.html public/rss-watcher/index.html
          cp ../rss-watcher/updates.json public/rss-watcher/updates.json
          cp ../rss-watcher/feed.en.xml public/rss-watcher/feed.en.xml
          cp ../rss-watcher/feed.fr.xml public/rss-watcher/feed.fr.xml
          cp ../rss-watcher/feeds-status.json public/rss-watcher/feeds-status.json
          mkdir -p public/rss-watcher/activity
          cp ../rss-watcher/activity/index.html public/rss-watcher/activity/index.html
          mkdir -p public/icons
          cp ../icons/index.html public/icons/index.html
          cp -R ../icons/export public/icons/export
          node ../icons/generate-manifest.mjs public/icons/icons.json
          mkdir -p public/emoji-sheet
          cp ../emoji-sheet/index.html public/emoji-sheet/index.html
          cp ../emoji-sheet/emojis.json public/emoji-sheet/emojis.json
          cp ../emoji-sheet/meta.json public/emoji-sheet/meta.json
          mkdir -p public/azure-release-updates
          cp ../azure-release-updates/index.html public/azure-release-updates/index.html
          cp ../azure-release-updates/updates.json public/azure-release-updates/updates.json
          mkdir -p public/m365-release-updates
          cp ../m365-release-updates/index.html public/m365-release-updates/index.html
          cp ../m365-release-updates/updates.json public/m365-release-updates/updates.json
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./blog/public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: DEPLOYMENT FINISHED
        run: echo "DEPLOYMENT FINISHED"