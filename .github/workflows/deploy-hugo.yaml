# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy site to GH Pages

on:
  push:
    branches:
      - main # Set a branch to deploy
  # Data-refresh workflows commit with the default GITHUB_TOKEN, which does NOT
  # trigger the push event above, so redeploy explicitly once they finish.
  workflow_run:
    workflows: ["Refresh Azure Release Updates", "Refresh M365 Release Updates", "Refresh AWS Release Updates", "Refresh RSS Watcher Updates", "Refresh GitHub IP Ranges", "Refresh Azure IP Ranges", "Refresh Microsoft Tech Community RSS Feeds", "Refresh Azure Taggable Resources", "Refresh Azure Policy Aliases", "Refresh Azure Regions", "Refresh Azure Policies"]
    types: [completed]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    env:
      HUGO_VERSION: 0.140.0 #0.134.2
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: |
          DART_SASS_VERSION=1.83.0
          wget -O ${{ runner.temp }}/dart-sass.tar.gz "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -xzf ${{ runner.temp }}/dart-sass.tar.gz -C ${{ runner.temp }}
          echo "${{ runner.temp }}/dart-sass" >> "$GITHUB_PATH"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        working-directory: blog
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        working-directory: blog
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: UTC
        run: |
          rm -rf public
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/blog/" \
            --destination public/blog
          cp ../index.html public/index.html
          cp ../index_fr.html public/index_fr.html
          cp ../CNAME public/CNAME
          cp ../sitemap.xml public/sitemap.xml
          cp ../robots.txt public/robots.txt
          cp ../llms.txt public/llms.txt
          mkdir -p public/.well-known
          cp ../.well-known/security.txt public/.well-known/security.txt
          cp ../og-image.png public/og-image.png
          node ../build-freshness.mjs public/freshness.json
          cp -R ../favicons public/favicons
          cp ../404.html public/404.html
          cp ../site.webmanifest public/site.webmanifest
          cp ../apple-touch-icon.png public/apple-touch-icon.png
          cp ../icon-192.png public/icon-192.png
          cp ../icon-512.png public/icon-512.png
          cp ../favicon.svg public/favicon.svg
          cp ../favicon.ico public/favicon.ico
          cp ../linkedin-photo.jpg public/linkedin-photo.jpg
          mkdir -p public/tools
          cp ../tools/index.html public/tools/index.html
          cp -R ../tools/images public/tools/images
          mkdir -p public/world-clock
          cp ../world-clock/index.html public/world-clock/index.html
          mkdir -p public/random-wheel
          cp ../random-wheel/index.html public/random-wheel/index.html
          mkdir -p public/units-converter
          cp ../units-converter/index.html public/units-converter/index.html
          mkdir -p public/sla-calculator
          cp ../sla-calculator/index.html public/sla-calculator/index.html
          mkdir -p public/workflows
          cp ../workflows/index.html public/workflows/index.html
          mkdir -p public/guid-generator
          cp ../guid-generator/index.html public/guid-generator/index.html
          mkdir -p public/subnet-calculator
          cp ../subnet-calculator/index.html public/subnet-calculator/index.html
          mkdir -p public/percentage-calculator
          cp ../percentage-calculator/index.html public/percentage-calculator/index.html
          mkdir -p public/github-ip-ranges
          cp ../github-ip-ranges/index.html public/github-ip-ranges/index.html
          cp ../github-ip-ranges/ip-ranges.json public/github-ip-ranges/ip-ranges.json
          mkdir -p public/azure-ip-ranges
          cp ../azure-ip-ranges/index.html public/azure-ip-ranges/index.html
          cp ../azure-ip-ranges/ip-ranges.json public/azure-ip-ranges/ip-ranges.json
          mkdir -p public/friends-websites
          cp ../friends-websites/index.html public/friends-websites/index.html
          cp ../friends-websites/friends-websites.csv public/friends-websites/friends-websites.csv
          cp ../friends-websites/websites-meta.json public/friends-websites/websites-meta.json
          mkdir -p public/azure-regions
          cp ../azure-regions/index.html public/azure-regions/index.html
          cp ../azure-regions/regions.json public/azure-regions/regions.json
          mkdir -p public/microsoft-techcommunity-rss-feeds
          cp ../microsoft-techcommunity-rss-feeds/index.html public/microsoft-techcommunity-rss-feeds/index.html
          cp ../microsoft-techcommunity-rss-feeds/microsoft-rss-feeds.csv public/microsoft-techcommunity-rss-feeds/microsoft-rss-feeds.csv
          cp ../microsoft-techcommunity-rss-feeds/feeds-status.json public/microsoft-techcommunity-rss-feeds/feeds-status.json
          mkdir -p public/azure-naming-convention
          cp ../azure-naming-convention/index.html public/azure-naming-convention/index.html
          cp ../azure-naming-convention/abbreviations.json public/azure-naming-convention/abbreviations.json
          mkdir -p public/azure-taggable-resources
          cp ../azure-taggable-resources/index.html public/azure-taggable-resources/index.html
          cp ../azure-taggable-resources/tag-support.json public/azure-taggable-resources/tag-support.json
          mkdir -p public/it-images
          cp ../it-images/index.html public/it-images/index.html
          cp -R ../it-images/export public/it-images/export
          node ../it-images/generate-manifest.mjs public/it-images/images.json
          mkdir -p public/favorite-links
          cp ../favorite-links/index.html public/favorite-links/index.html
          cp ../favorite-links/favorite-links.csv public/favorite-links/favorite-links.csv
          mkdir -p public/azure-policy-aliases
          cp ../azure-policy-aliases/index.html public/azure-policy-aliases/index.html
          cp ../azure-policy-aliases/policy-aliases.json public/azure-policy-aliases/policy-aliases.json
          mkdir -p public/microsoft-portals
          cp ../microsoft-portals/index.html public/microsoft-portals/index.html
          cp ../microsoft-portals/portals-urls.csv public/microsoft-portals/portals-urls.csv
          mkdir -p public/rss-watcher
          cp ../rss-watcher/index.html public/rss-watcher/index.html
          cp ../rss-watcher/updates.json public/rss-watcher/updates.json
          cp ../rss-watcher/feed.en.xml public/rss-watcher/feed.en.xml
          cp ../rss-watcher/feed.fr.xml public/rss-watcher/feed.fr.xml
          cp ../rss-watcher/feeds-status.json public/rss-watcher/feeds-status.json
          mkdir -p public/rss-watcher/activity
          cp ../rss-watcher/activity/index.html public/rss-watcher/activity/index.html
          mkdir -p public/icons
          cp ../icons/index.html public/icons/index.html
          cp -R ../icons/export public/icons/export
          node ../icons/generate-manifest.mjs public/icons/icons.json
          mkdir -p public/emoji-sheet
          cp ../emoji-sheet/index.html public/emoji-sheet/index.html
          cp ../emoji-sheet/emojis.json public/emoji-sheet/emojis.json
          cp ../emoji-sheet/meta.json public/emoji-sheet/meta.json
          mkdir -p public/azure-release-updates
          cp ../azure-release-updates/index.html public/azure-release-updates/index.html
          cp ../azure-release-updates/updates.json public/azure-release-updates/updates.json
          mkdir -p public/m365-release-updates
          cp ../m365-release-updates/index.html public/m365-release-updates/index.html
          cp ../m365-release-updates/updates.json public/m365-release-updates/updates.json
          mkdir -p public/aws-release-updates
          cp ../aws-release-updates/index.html public/aws-release-updates/index.html
          cp ../aws-release-updates/updates.json public/aws-release-updates/updates.json
          mkdir -p public/azure-policies
          cp ../azure-policies/index.html public/azure-policies/index.html
          cp ../azure-policies/policydefinitions.json public/azure-policies/policydefinitions.json
          cp ../azure-policies/policysetdefinitions.json public/azure-policies/policysetdefinitions.json
          mkdir -p public/articles
          cp ../articles/index.html public/articles/index.html
          cp ../articles/articles.json public/articles/articles.json
          cp ../articles/rss.xml public/articles/rss.xml
          cp -R ../articles/images public/articles/images
          for dir in ../articles/*/; do
            slug=$(basename "$dir")
            if [ "$slug" != "content" ] && [ "$slug" != "images" ]; then
              mkdir -p "public/articles/$slug"
              cp "$dir/index.html" "public/articles/$slug/index.html"
            fi
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./blog/public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: DEPLOYMENT FINISHED
        run: echo "DEPLOYMENT FINISHED"