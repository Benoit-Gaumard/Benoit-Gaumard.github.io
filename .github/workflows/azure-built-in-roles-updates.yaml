name: Refresh Azure Built-in Roles

on:
  schedule:
    # 06:00 and 09:00 and 12:00 and 15:00 UTC (4 times daily)
    - cron: '15 6 * * *'
    - cron: '15 9 * * *'
    - cron: '15 12 * * *'
    - cron: '15 15 * * *'
    # Weekly dated snapshot (Monday 18:15 UTC, outside the daily refresh times above) to track role changes over time
    - cron: '15 18 * * 1'
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Also save a dated snapshot (normally only done on the weekly schedule)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: azure-built-in-roles-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest Azure built-in roles
        shell: pwsh
        env:
          # Only used to raise the GitHub API rate limit when listing the
          # category files; the data itself comes from public raw content.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./azure-built-in-roles/fetch-updates.ps1

      - name: Save weekly dated snapshot
        if: github.event.schedule == '15 18 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.snapshot)
        run: |
          mkdir -p azure-built-in-roles/history
          snapshot_date=$(date -u +%Y-%m-%d)
          cp azure-built-in-roles/roles.json "azure-built-in-roles/history/roles-${snapshot_date}.json"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add azure-built-in-roles/roles.json
          if [ -d azure-built-in-roles/history ]; then
            git add azure-built-in-roles/history
          fi
          if git diff --cached --quiet; then
            echo "No changes to Azure built-in roles data."
          else
            git commit -m "chore: refresh Azure built-in roles data"
            git push
          fi
