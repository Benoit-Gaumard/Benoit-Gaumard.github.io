name: Fold Community Submissions

# Community PRs add one issue-scoped file each (CSV, or JSON for friends' websites).
# Fold merged submissions into their reference catalogue, then delete the proposals.
on:
  push:
    branches:
      - main
    paths:
      - 'favorite-links/submissions/issue-*.csv'
      - 'friends-websites/submissions/issue-*.json'
      - 'microsoft-portals/submissions/issue-*.csv'
      - 'rss-watcher/submissions/issue-*.csv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fold-submissions
  cancel-in-progress: false

jobs:
  fold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fold submissions into reference catalogues
        run: |
          node .github/scripts/fold-submissions.mjs \
            favorite-links/favorite-links.csv favorite-links/submissions \
            microsoft-portals/portals-urls.csv microsoft-portals/submissions \
            rss-watcher/rss-feeds.csv rss-watcher/submissions
          node friends-websites/catalogue.mjs fold friends-websites/websites-meta.json friends-websites/submissions

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A favorite-links friends-websites microsoft-portals rss-watcher
          if git diff --cached --quiet; then
            echo "Nothing to fold."
          else
            git commit -m "chore: fold community submissions into reference catalogues"
            git pull --rebase
            git push
          fi
