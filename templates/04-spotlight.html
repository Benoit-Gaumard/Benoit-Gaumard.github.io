<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>04 — Spotlight / Tools design study</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme = param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="templates.css">
  <script src="templates.js" defer></script>
</head>
<body class="spotlight" data-design="spotlight">
  <a class="skip" href="#main">Skip to content</a>
  <div class="review-bar" id="review"></div>
  <header class="site-header" id="header"></header>
  <main class="wrap" id="main">
    <section class="hero">
      <p class="eyebrow">The useful things, in one place.</p>
      <h1>Less browsing.<br>More doing.</h1>
      <p class="lede">Find the right tool. Get on with what matters.</p>
      <div id="searchHost"></div>
    </section>
    <section class="catalog-shell" aria-label="Tool catalogue">
      <div class="toolbar"><div class="filters" id="filters"></div><button class="saved-toggle" id="savedToggle" type="button" aria-pressed="false"></button></div>
      <div class="results-line"><p id="resultCount" role="status" aria-live="polite"></p><button class="clear-button" id="clearFilters" type="button" hidden>Clear filters</button></div>
      <p class="storage-notice" id="storageNotice" role="status" hidden></p>
      <div id="toolResults"></div>
      <div class="empty" id="empty" hidden><h2>No match. No problem.</h2><p>Try a broader search or choose another collection.</p><button id="emptyReset" type="button">Show all tools</button></div>
      <noscript><p>This interactive design study needs JavaScript. <a href="/tools/">Browse the original tool catalogue.</a></p></noscript>
    </section>
  </main>
  <footer class="site-footer"><div class="wrap footer-inner"><p>Less interface. More useful. / Benoit Gaumard</p><p>Concept 04 / Spotlight · <a href="./">Explore all five designs</a></p></div></footer>
</body>
</html>
