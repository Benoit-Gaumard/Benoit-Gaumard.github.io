<html lang="en">

        if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    })();
  </script>

  <title>Microsoft Portals | Benoit Gaumard</title>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f5faff;
      --cp-surface: #ffffff;
      --cp-surface-soft: #eef7ff;
      --cp-border: #d8e8f5;
      --cp-border-strong: #89afd0;
      --cp-text: #17324d;
      --cp-text-muted: #536f88;
      --cp-accent: #0b6fb8;
      --cp-accent-hover: #075b98;
      --cp-accent-soft: rgba(11, 111, 184, 0.09);
      --cp-accent-fg: #ffffff;
      --cp-link: #0969b5;
      --cp-shadow: 0 18px 48px rgba(36, 92, 136, 0.14);
      --cp-panel-strong: rgba(255, 255, 255, 0.97);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #0c1420;
      --cp-bg-elevated: #101c2c;
      --cp-surface: #16233a;
      --cp-surface-soft: #1c2c42;
      --cp-border: #253b52;
      --cp-border-strong: #3f6280;
      --cp-text: #e8f1fa;
      --cp-text-muted: #9db3c7;
      --cp-text-soft: #b7c9d8;
      --cp-accent: #4fa8ea;
      --cp-accent-hover: #6fbdf3;
      --cp-accent-soft: rgba(79, 168, 234, 0.16);
      --cp-accent-fg: #ffffff;
      --cp-success: #35c98d;
      --cp-success-bg: #113325;
      --cp-danger: #f3696a;
      --cp-danger-bg: #3c1919;
      --cp-warning: #e4a940;
      --cp-warning-bg: #3b2c10;
      --cp-violet: #a58cf5;
      --cp-violet-bg: #251d47;
      --cp-cyan: #4bd7f4;
      --cp-link: #6fbdf3;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
      --cp-overlay: rgba(10, 17, 28, 0.84);
      --cp-panel: rgba(20, 32, 50, 0.9);
      --cp-panel-strong: rgba(16, 26, 41, 0.97);
      --cp-sheen: rgba(255, 255, 255, 0.06);
      --cp-highlight: rgba(79, 168, 234, 0.2);
      --cp-highlight-bg: #3c3410;
      --cp-highlight-border: #d4a017;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      min-width: 18rem;
      margin: 0;
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    body::before {
      z-index: -2;
      background:
        radial-gradient(44rem 34rem at 6% -12%, rgba(15, 176, 212, .22), transparent 60%),
        radial-gradient(40rem 36rem at 106% 6%, rgba(123, 97, 255, .16), transparent 58%),
        radial-gradient(48rem 42rem at 48% 118%, rgba(47, 127, 245, .16), transparent 62%);
      filter: blur(6px);
      animation: aurora-drift 30s ease-in-out infinite alternate;
    }
    body::after {
      z-index: -1;
      background-image: radial-gradient(rgba(11, 111, 184, .18) 1px, transparent 1px);
      background-size: 1.5rem 1.5rem;
      -webkit-mask-image: radial-gradient(70% 55% at 50% 0%, #000 35%, transparent 92%);
      mask-image: radial-gradient(70% 55% at 50% 0%, #000 35%, transparent 92%);
    }
    @keyframes aurora-drift {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(-2%, 2%, 0) scale(1.05); }
    }

    button, input, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: var(--cp-link); }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid var(--cp-accent);
      outline-offset: 2px;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--cp-border);
      background: var(--cp-panel-strong);
      backdrop-filter: blur(12px);
    }
    .header-inner, main, .footer-inner {
      width: min(90rem, calc(100% - 2rem));
      margin-inline: auto;
    }
    .header-inner {
      min-height: 4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand { display: flex; align-items: center; gap: .5rem; color: var(--cp-text); font-size: 1rem; font-weight: 700; text-decoration: none; }
    .brand-mark { color: var(--cp-accent); }
    .brand .mark { width: 1.75rem; height: 1.75rem; flex: 0 0 auto; border-radius: 6px; }
    .header-links { display: flex; align-items: center; gap: 1rem; }
    .header-links a { display: inline-flex; align-items: center; gap: .45rem; color: var(--cp-text-muted); text-decoration: none; }
    .nav-icon { flex: 0 0 auto; opacity: .7; }
    .header-links a:hover .nav-icon, .header-links a[aria-current="page"] .nav-icon { opacity: 1; }
    .header-links a:hover { color: var(--cp-text); }
    .header-links a[aria-current="page"] { color: var(--cp-text); font-weight: 600; }
    .menu-toggle { display: none; align-items: center; justify-content: center; width: 2.25rem; height: 2.25rem; padding: 0; border: 1px solid var(--cp-border); border-radius: 6px; background: transparent; color: var(--cp-text); cursor: pointer; flex: 0 0 auto; }
    .menu-toggle:hover { border-color: var(--cp-border-strong); }
    .menu-toggle .menu-icon-close { display: none; }
    .menu-toggle[aria-expanded="true"] .menu-icon-open { display: none; }
    .menu-toggle[aria-expanded="true"] .menu-icon-close { display: block; }
    .header-actions { display: flex; align-items: center; gap: .25rem; flex: 0 0 auto; }
    .social-link { display: inline-flex; align-items: center; justify-content: center; width: 2rem; height: 2rem; border-radius: 6px; color: var(--cp-text-muted); flex: 0 0 auto; }
    .social-link:hover { color: var(--cp-accent); background: var(--cp-surface); }
    .theme-toggle { display: inline-flex; align-items: center; justify-content: center; width: 2rem; height: 2rem; padding: 0; border: none; border-radius: 6px; background: transparent; color: var(--cp-text-muted); cursor: pointer; flex: 0 0 auto; }
    .theme-toggle:hover { color: var(--cp-accent); background: var(--cp-surface); }
    .theme-toggle .theme-icon-sun { display: none; }
    :root[data-theme="dark"] .theme-toggle .theme-icon-sun { display: inline-flex; }
    :root[data-theme="dark"] .theme-toggle .theme-icon-moon { display: none; }

    main { padding-block: 2.5rem 4rem; }
    .intro { max-width: 52rem; margin-bottom: 2rem; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.25rem); line-height: 1.05; }
    .intro-text { max-width: 44rem; margin: 1rem 0 0; color: var(--cp-text-muted); font-size: 1.05rem; }

    .filter-bar { display: flex; flex-wrap: wrap; gap: .75rem; margin-bottom: 1.5rem; }
    .filter-bar input, .filter-bar select {
      min-height: 2.9rem;
      border: 1px solid var(--cp-border-strong);
      border-radius: 8px;
      background: var(--cp-surface);
      color: var(--cp-text);
      padding: .5rem .85rem;
    }
    .filter-bar input { flex: 2 1 14rem; min-width: 0; }
    .filter-bar select { flex: 1 1 11rem; width: 11rem; max-width: 100%; min-width: 0; }

    .portals-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: 1.25rem; }
    .results-count { margin: 0; color: var(--cp-text-muted); font-size: .9rem; }
    .view-toggle {
      display: inline-flex;
      gap: .25rem;
      padding: .25rem;
      border: 1px solid var(--cp-border);
      border-radius: 10px;
      background: var(--cp-surface);
    }
    .view-toggle-button {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      padding: .45rem .9rem;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--cp-text-muted);
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .view-toggle-button:hover { color: var(--cp-text); }
    .view-toggle-button.is-active {
      background: var(--cp-accent-soft);
      color: var(--cp-accent);
    }
    .view-toggle-button svg { flex: 0 0 auto; }

    .portal-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
      gap: 1.25rem;
    }
    .portal-card {
      display: flex;
      flex-direction: column;
      gap: .75rem;
      padding: 1.5rem;
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
      border-radius: 12px;
      text-decoration: none;
      color: var(--cp-text);
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .portal-card:hover, .portal-card:focus-visible {
      transform: translateY(-4px);
      border-color: var(--cp-accent);
      box-shadow: var(--cp-shadow);
    }
    .portal-card-header { display: flex; align-items: center; gap: .75rem; }
    .portal-avatar {
      display: grid;
      place-items: center;
      width: 2.75rem;
      height: 2.75rem;
      flex: 0 0 auto;
      border-radius: 10px;
      background: var(--cp-surface-soft);
      color: var(--cp-accent);
      font-weight: 800;
      font-size: 1.1rem;
      overflow: hidden;
    }
    .portal-avatar img { width: 1.75rem; height: 1.75rem; object-fit: contain; }
    .portal-card h2 { margin: 0; font-size: 1.05rem; line-height: 1.3; overflow-wrap: anywhere; }
    .portal-tag {
      display: inline-flex;
      align-self: flex-start;
      padding: .2rem .6rem;
      border-radius: 999px;
      background: var(--cp-accent-soft);
      color: var(--cp-accent);
      font-size: .75rem;
      font-weight: 700;
    }
    .portal-url { margin: 0; color: var(--cp-text-muted); font-size: .85rem; overflow-wrap: anywhere; }
    .portal-arrow {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: .35rem;
      color: var(--cp-accent);
      font-size: .85rem;
      font-weight: 600;
    }
    .portal-arrow svg { transition: transform .2s ease; }
    .portal-card:hover .portal-arrow svg, .portal-card:focus-visible .portal-arrow svg { transform: translate(2px, -2px); }

    .portal-cards.list-view { grid-template-columns: 1fr; gap: .6rem; }
    .portal-cards.list-view .portal-card {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      gap: 1rem;
      padding: .65rem 1.25rem;
      min-width: 0;
    }
    .portal-cards.list-view .portal-card:hover, .portal-cards.list-view .portal-card:focus-visible { transform: none; }
    .portal-cards.list-view .portal-card-header { flex: 1 1 auto; min-width: 0; }
    .portal-cards.list-view .portal-avatar { width: 2.25rem; height: 2.25rem; }
    .portal-cards.list-view .portal-card h2 {
      min-width: 0;
      font-size: 1rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .portal-cards.list-view .portal-tag { flex: 0 0 auto; }
    .portal-cards.list-view .portal-url { display: none; }
    .portal-cards.list-view .portal-arrow { flex: 0 0 auto; margin-top: 0; }

    .empty-state {
      padding: 2.5rem;
      border: 1px dashed var(--cp-border-strong);
      border-radius: 12px;
      text-align: center;
      color: var(--cp-text-muted);
    }

    footer.site-footer { border-top: 1px solid var(--cp-border); background: var(--cp-panel-strong); color: var(--cp-text-muted); }
    .footer-inner { padding-block: 2rem 1.5rem; }
    .footer-main { display: grid; grid-template-columns: minmax(16rem, 1fr) repeat(2, minmax(10rem, auto)); gap: 3rem; padding-bottom: 1.5rem; }
    .footer-about { max-width: 30rem; }
    .footer-about p { margin: .75rem 0 0; font-size: .875rem; line-height: 1.6; }
    .footer-group { display: flex; align-items: flex-start; flex-direction: column; gap: .5rem; }
    .footer-group strong { margin-bottom: .125rem; color: var(--cp-text); font-size: .75rem; text-transform: uppercase; }
    .footer-group a { color: var(--cp-text-muted); font-size: .875rem; text-decoration: none; }
    .footer-group a:hover { color: var(--cp-link); }
    .footer-bottom { display: flex; justify-content: space-between; gap: 1rem; padding-top: 1rem; border-top: 1px solid var(--cp-border); font-size: .8rem; }

    .back-to-top {
      position: fixed;
      right: 1.5rem;
      bottom: 1.5rem;
      z-index: 30;
      display: grid;
      place-items: center;
      width: 3rem;
      height: 3rem;
      padding: 0;
      border: 1px solid var(--cp-border);
      border-radius: 50%;
      background: var(--cp-accent);
      color: var(--cp-accent-fg);
      cursor: pointer;
      box-shadow: var(--cp-shadow);
      opacity: 0;
      transform: translateY(.75rem);
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }
    .back-to-top.visible { opacity: 1; transform: none; pointer-events: auto; }
    .back-to-top:hover { background: var(--cp-accent-hover); }

    @media (max-width: 48rem) {
      .header-inner { flex-wrap: nowrap; min-height: auto; padding-block: .75rem; position: relative; }
      .menu-toggle { display: inline-flex; }
      .header-links { display: none; position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; align-items: stretch; gap: 0; background: var(--cp-panel-strong); border: 1px solid var(--cp-border); border-radius: 10px; padding: .5rem; box-shadow: var(--cp-shadow); margin-top: .5rem; z-index: 30; }
      .header-links.nav-open { display: flex; }
      .header-links a { padding: .65rem .75rem; border-radius: 6px; }
      .header-links a:hover { background: var(--cp-panel); }
      .footer-main { grid-template-columns: 1fr 1fr; gap: 2rem; }
      .footer-about { grid-column: 1 / -1; }
    }
    @media (max-width: 32rem) {
      .header-inner, main, .footer-inner { width: min(100% - 1rem, 90rem); }
      main { padding-top: 1.75rem; }
      .filter-bar { flex-direction: column; align-items: stretch; }
      .filter-bar select { width: auto; }
      .portal-cards.list-view .portal-tag { display: none; }
      .portal-cards.list-view .portal-arrow { font-size: 0; }
      .portal-cards.list-view .portal-arrow svg { width: 16px; height: 16px; }
      .back-to-top { right: 1rem; bottom: 1rem; }
      .footer-main { grid-template-columns: 1fr; }
      .footer-about { grid-column: auto; }
      .footer-bottom { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      body::before { animation: none; }
    }
  </style>
</head>

          <a href="/azure-release-updates/">Azure Updates</a>
          <a href="/m365-release-updates/">M365 Updates</a>
        </div>
      </div>
      <div class="footer-bottom">
        <span>&copy; <span id="currentYear"></span> Benoit Gaumard</span>
      </div>
    </div>
  </footer>

  <button class="back-to-top" id="backToTop" type="button" aria-label="Back to top">
    <svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
      <path d="M8 13V3M3 8l5-5 5 5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <script>
    document.getElementById("currentYear").textContent = new Date().getFullYear();

    const elements = {
      searchInput: document.getElementById("searchInput"),
      categoryFilter: document.getElementById("categoryFilter"),
      resultsCount: document.getElementById("resultsCount"),
      portalCards: document.getElementById("portalCards"),
      backToTop: document.getElementById("backToTop"),
    };

    const VIEW_STORAGE_KEY = "microsoft-portals-view-mode";
    const viewButtons = [...document.querySelectorAll(".view-toggle-button")];

    function applyView(view) {
      elements.portalCards.classList.toggle("list-view", view === "list");
      viewButtons.forEach((button) => {
        const isActive = button.dataset.view === view;
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });
    }

    function loadView() {
      try {
        return localStorage.getItem(VIEW_STORAGE_KEY) === "list" ? "list" : "cards";
      } catch {
        return "cards";
      }
    }

    applyView(loadView());

    viewButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const view = button.dataset.view;
        applyView(view);
        try {
          localStorage.setItem(VIEW_STORAGE_KEY, view);
        } catch {
          // ignore storage errors (private browsing, quota, etc.)
        }
      });
    });

    let portals = [];

    function parseCsvLine(line) {
      const cells = [];
      let current = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (inQuotes) {
          if (char === '"') {
            if (line[i + 1] === '"') { current += '"'; i++; } else inQuotes = false;
          } else {
            current += char;
          }
        } else if (char === '"') {
          inQuotes = true;
        } else if (char === ",") {
          cells.push(current);
          current = "";
        } else {
          current += char;
        }
      }
      cells.push(current);
      return cells;
    }

    function parseCsv(text) {
      // Split into records, not lines: quoted fields may contain literal newlines.
      const records = [];
      let current = "";
      let inQuotes = false;
      const normalized = text.replace(/\r\n/g, "\n");
      for (let i = 0; i < normalized.length; i++) {
        const char = normalized[i];
        if (char === '"') inQuotes = !inQuotes;
        if (char === "\n" && !inQuotes) {
          records.push(current);
          current = "";
        } else {
          current += char;
        }
      }
      if (current.trim()) records.push(current);

      const headers = parseCsvLine(records[0]).map((header) => header.trim().toLowerCase());
      return records.slice(1).filter((record) => record.trim()).map((record) => {
        const cells = parseCsvLine(record);
        const row = {};
        headers.forEach((header, index) => { row[header] = (cells[index] ?? "").trim(); });
        return row;
      });
    }

    function normalize(value) {
      return value.toLocaleLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function hostnameFor(url) {
      try {
        return new URL(url).hostname.replace(/^www\./, "");
      } catch {
        return url;
      }
    }

    function faviconUrlFor(url) {
      return `https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(hostnameFor(url))}`;
    }

    function initials(name) {
      return name.split(/\s+/).map((part) => part[0]).filter(Boolean).join("").slice(0, 2).toUpperCase();
    }

    function populateFilters() {
      const categories = [...new Set(portals.map((portal) => portal.categorie).filter(Boolean))].sort((a, b) => a.localeCompare(b));
      categories.forEach((category) => elements.categoryFilter.append(new Option(category, category)));
    }

    function createCard(portal) {
      const card = document.createElement("a");
      card.className = "portal-card";
      card.href = portal.url;
      card.target = "_blank";
      card.rel = "noopener";

      const header = document.createElement("div");
      header.className = "portal-card-header";
      const avatar = document.createElement("span");
      avatar.className = "portal-avatar";
      const favicon = document.createElement("img");
      favicon.src = faviconUrlFor(portal.url);
      favicon.alt = "";
      favicon.loading = "lazy";
      favicon.addEventListener("error", () => {
        favicon.remove();
        avatar.textContent = initials(portal.name);
      }, { once: true });
      avatar.append(favicon);
      const heading = document.createElement("h2");
      heading.textContent = portal.name;
      header.append(avatar, heading);

      card.append(header);

      if (portal.categorie) {
        const tag = document.createElement("span");
        tag.className = "portal-tag";
        tag.textContent = portal.categorie;
        card.append(tag);
      }

      const url = document.createElement("p");
      url.className = "portal-url";
      url.textContent = hostnameFor(portal.url);

      const arrow = document.createElement("span");
      arrow.className = "portal-arrow";
      arrow.innerHTML = 'Open portal <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>';

      card.append(url, arrow);
      return card;
    }

    function renderCards() {
      const query = normalize(elements.searchInput.value.trim());
      const category = elements.categoryFilter.value;

      const filtered = portals.filter((portal) => {
        if (category && portal.categorie !== category) return false;
        if (query && !normalize(`${portal.name} ${portal.categorie}`).includes(query)) return false;
        return true;
      });

      elements.resultsCount.textContent = filtered.length === 1
        ? "1 portal found."
        : `${filtered.length.toLocaleString()} portals found.`;
      elements.portalCards.replaceChildren();

      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "No portals match your filters.";
        elements.portalCards.append(empty);
        return;
      }

      const fragment = document.createDocumentFragment();
      filtered.forEach((portal) => fragment.append(createCard(portal)));
      elements.portalCards.append(fragment);
    }

    async function init() {
      const response = await fetch("./portals-urls.csv", { cache: "no-store" });
      const csvText = await response.text();
      portals = parseCsv(csvText)
        .filter((row) => row.name && row.url)
        .map((row) => ({ name: row.name, categorie: row.categorie, url: row.url }))
        .sort((a, b) => a.name.localeCompare(b.name));
      populateFilters();
      renderCards();
    }

    elements.searchInput.addEventListener("input", renderCards);
    elements.categoryFilter.addEventListener("change", renderCards);

    init();

    let scrollTicking = false;
    window.addEventListener("scroll", () => {
      if (scrollTicking) return;
      scrollTicking = true;
      requestAnimationFrame(() => {
        elements.backToTop.classList.toggle("visible", window.scrollY > 600);
        scrollTicking = false;
      });
    }, { passive: true });
    elements.backToTop.addEventListener("click", () => {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
  <script>
    (function () {
      var toggle = document.getElementById("menuToggle");
      var nav = document.getElementById("primaryNav");
      if (!toggle || !nav) return;
      function closeMenu() { nav.classList.remove("nav-open"); toggle.setAttribute("aria-expanded", "false"); }
      function openMenu() { nav.classList.add("nav-open"); toggle.setAttribute("aria-expanded", "true"); }
      toggle.addEventListener("click", function (e) {
        e.stopPropagation();
        if (nav.classList.contains("nav-open")) closeMenu(); else openMenu();
      });
      nav.addEventListener("click", function (e) { if (e.target.tagName === "A") closeMenu(); });
      document.addEventListener("click", function (e) {
        if (!nav.contains(e.target) && e.target !== toggle && !toggle.contains(e.target)) closeMenu();
      });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeMenu(); });
      window.addEventListener("resize", function () { if (window.innerWidth > 760) closeMenu(); });
    })();
  </script>
  <script>
    (function () {
      var toggle = document.getElementById("themeToggle");
      if (!toggle) return;
      toggle.addEventListener("click", function () {
        var isDark = document.documentElement.getAttribute("data-theme") === "dark";
        var next = isDark ? "light" : "dark";
        if (next === "dark") document.documentElement.setAttribute("data-theme", "dark");
        else document.documentElement.removeAttribute("data-theme");
        try { localStorage.setItem("site-theme", next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
