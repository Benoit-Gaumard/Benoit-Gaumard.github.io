<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Azure Lighthouse - cross-tenant management">
  <defs>
    <linearGradient id="lhbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b3a63"/>
      <stop offset="100%" stop-color="#08131f"/>
    </linearGradient>
    <linearGradient id="lhbeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd479" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffd479" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lhbeam2" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffd479" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffd479" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#lhbg)"/>

  <text x="600" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#7fc4ff" text-anchor="middle" letter-spacing="5">AZURE LIGHTHOUSE</text>

  <!-- light beams -->
  <polygon points="600,190 180,120 180,300" fill="url(#lhbeam2)"/>
  <polygon points="600,190 1020,120 1020,300" fill="url(#lhbeam)"/>

  <!-- lighthouse tower -->
  <g>
    <rect x="565" y="205" width="70" height="150" fill="#ffffff" opacity="0.95"/>
    <rect x="565" y="235" width="70" height="22" fill="#d13438"/>
    <rect x="565" y="285" width="70" height="22" fill="#d13438"/>
    <rect x="556" y="176" width="88" height="32" rx="6" fill="#ffd479"/>
    <polygon points="600,140 650,178 550,178" fill="#7fc4ff"/>
    <rect x="548" y="355" width="104" height="26" rx="5" fill="#e6edf3"/>
  </g>

  <!-- managing tenant label -->
  <text x="600" y="418" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffd479" text-anchor="middle">MANAGING TENANT</text>

  <!-- managed tenants -->
  <g>
    <rect x="120" y="440" width="230" height="70" rx="12" fill="#10476f" stroke="#7fc4ff" stroke-width="3"/>
    <text x="235" y="484" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#ffffff" text-anchor="middle">Customer tenant A</text>

    <rect x="400" y="440" width="230" height="70" rx="12" fill="#10476f" stroke="#7fc4ff" stroke-width="3"/>
    <text x="515" y="484" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#ffffff" text-anchor="middle">Customer tenant B</text>

    <rect x="680" y="440" width="230" height="70" rx="12" fill="#10476f" stroke="#7fc4ff" stroke-width="3"/>
    <text x="795" y="484" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#ffffff" text-anchor="middle">Subsidiary tenant</text>

    <rect x="960" y="440" width="120" height="70" rx="12" fill="#10476f" stroke="#7fc4ff" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="1020" y="484" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#7fc4ff" text-anchor="middle">n...</text>
  </g>

  <text x="600" y="570" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">One tenant. Every customer. Zero guest accounts.</text>
  <text x="600" y="606" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#7fc4ff" text-anchor="middle">Azure delegated resource management</text>
</svg>
