<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Azure Policy Part 6 - Azure Policy as Code">
  <defs>
    <linearGradient id="pol6bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b6fb8"/>
      <stop offset="100%" stop-color="#17324d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#pol6bg)"/>

  <text x="600" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#9fd0f2" text-anchor="middle" letter-spacing="4">AZURE POLICY &#183; PART 6</text>

  <!-- repo -->
  <rect x="100" y="235" width="210" height="140" rx="14" fill="#ffffff" opacity="0.97"/>
  <text x="205" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d" text-anchor="middle">Git repo</text>
  <text x="205" y="318" font-family="Consolas, Menlo, monospace" font-size="16" fill="#536f88" text-anchor="middle">*.json</text>
  <text x="205" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#536f88" text-anchor="middle">the source of truth</text>

  <g stroke="#9fd0f2" stroke-width="6" stroke-linecap="round">
    <line x1="322" y1="305" x2="366" y2="305"/>
  </g>
  <path d="M366 290 L394 305 L366 320 Z" fill="#9fd0f2"/>

  <!-- PR review -->
  <rect x="404" y="235" width="200" height="140" rx="14" fill="#ffffff" opacity="0.97"/>
  <text x="504" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d" text-anchor="middle">Pull request</text>
  <text x="504" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#536f88" text-anchor="middle">review + what-if</text>
  <text x="504" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#536f88" text-anchor="middle">plan artifact</text>

  <g stroke="#9fd0f2" stroke-width="6" stroke-linecap="round">
    <line x1="616" y1="305" x2="660" y2="305"/>
  </g>
  <path d="M660 290 L688 305 L660 320 Z" fill="#9fd0f2"/>

  <!-- pipeline -->
  <rect x="698" y="235" width="200" height="140" rx="14" fill="#c88719"/>
  <text x="798" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Pipeline</text>
  <text x="798" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#fff3dd" text-anchor="middle">OIDC &#183; no secrets</text>
  <text x="798" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#fff3dd" text-anchor="middle">plan / deploy gates</text>

  <g stroke="#9fd0f2" stroke-width="6" stroke-linecap="round">
    <line x1="910" y1="305" x2="954" y2="305"/>
  </g>
  <path d="M954 290 L982 305 L954 320 Z" fill="#9fd0f2"/>

  <!-- tenant -->
  <rect x="992" y="235" width="120" height="140" rx="14" fill="#ffffff" opacity="0.97"/>
  <text x="1052" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0b6fb8" text-anchor="middle">Tenant</text>
  <text x="1052" y="324" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0b6fb8" text-anchor="middle">scopes</text>

  <text x="600" y="490" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">Azure Policy as Code</text>
  <text x="600" y="538" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#9fd0f2" text-anchor="middle">export &#183; review &#183; plan &#183; deploy &#183; remediate</text>
</svg>
