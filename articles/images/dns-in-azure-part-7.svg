<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="DNS in Azure Part 7 - DNS security policies">
  <defs>
    <linearGradient id="dns7bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a32752"/>
      <stop offset="100%" stop-color="#2c1023"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#dns7bg)"/>

  <text x="600" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#f4b7cd" text-anchor="middle" letter-spacing="4">DNS IN AZURE &#183; PART 7</text>

  <!-- vnet -->
  <rect x="90" y="215" width="235" height="150" rx="14" fill="#521230" stroke="#f4b7cd" stroke-width="3"/>
  <text x="207" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Virtual network</text>
  <text x="207" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#f4b7cd" text-anchor="middle">every DNS query</text>

  <!-- policy -->
  <rect x="400" y="180" width="400" height="220" rx="18" fill="#ffffff" opacity="0.97"/>
  <text x="600" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#2c1023" text-anchor="middle">DNS security policy</text>
  <rect x="430" y="243" width="340" height="46" rx="10" fill="#fce7ef"/>
  <text x="600" y="273" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#a32752" text-anchor="middle">Traffic rules &#183; domain lists</text>
  <rect x="430" y="299" width="340" height="46" rx="10" fill="#fce7ef"/>
  <text x="600" y="329" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#a32752" text-anchor="middle">Threat intelligence</text>
  <rect x="430" y="355" width="340" height="34" rx="10" fill="#fce7ef"/>
  <text x="600" y="379" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#a32752" text-anchor="middle">Query logging</text>

  <!-- verdicts -->
  <rect x="875" y="200" width="235" height="60" rx="12" fill="#521230" stroke="#f4b7cd" stroke-width="3"/>
  <text x="992" y="239" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Allow</text>
  <rect x="875" y="272" width="235" height="60" rx="12" fill="#521230" stroke="#f4b7cd" stroke-width="3"/>
  <text x="992" y="311" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Alert</text>
  <rect x="875" y="344" width="235" height="60" rx="12" fill="#521230" stroke="#f4b7cd" stroke-width="3"/>
  <text x="992" y="383" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Block</text>

  <g stroke="#f4b7cd" stroke-width="5" stroke-linecap="round">
    <line x1="325" y1="290" x2="392" y2="290"/>
    <line x1="808" y1="290" x2="868" y2="290"/>
  </g>

  <text x="600" y="475" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">DNS Security Policies</text>
  <text x="600" y="527" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#f4b7cd" text-anchor="middle">filtering &#183; threat intelligence &#183; query logs at last</text>
</svg>
