<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Azure Policy Part 7 - EPAC and policy as code tooling">
  <defs>
    <linearGradient id="pol7bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b6fb8"/>
      <stop offset="100%" stop-color="#17324d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#pol7bg)"/>

  <text x="600" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#9fd0f2" text-anchor="middle" letter-spacing="4">AZURE POLICY &#183; PART 7</text>

  <!-- Definitions folder -->
  <rect x="110" y="190" width="300" height="250" rx="14" fill="#ffffff" opacity="0.97"/>
  <text x="140" y="232" font-family="Consolas, Menlo, monospace" font-size="20" font-weight="700" fill="#17324d">Definitions/</text>
  <text x="162" y="268" font-family="Consolas, Menlo, monospace" font-size="16" fill="#536f88">policyDefinitions/</text>
  <text x="162" y="298" font-family="Consolas, Menlo, monospace" font-size="16" fill="#536f88">policySetDefinitions/</text>
  <text x="162" y="328" font-family="Consolas, Menlo, monospace" font-size="16" fill="#536f88">policyAssignments/</text>
  <text x="162" y="358" font-family="Consolas, Menlo, monospace" font-size="16" fill="#536f88">policyExemptions/</text>
  <text x="162" y="388" font-family="Consolas, Menlo, monospace" font-size="16" fill="#536f88">global-settings.jsonc</text>
  <rect x="140" y="406" width="240" height="8" rx="4" fill="#c6dbec"/>

  <g stroke="#9fd0f2" stroke-width="6" stroke-linecap="round">
    <line x1="424" y1="315" x2="472" y2="315"/>
  </g>
  <path d="M472 300 L500 315 L472 330 Z" fill="#9fd0f2"/>

  <!-- three stages -->
  <rect x="516" y="200" width="330" height="72" rx="12" fill="#ffffff" opacity="0.97"/>
  <text x="681" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#0b6fb8" text-anchor="middle">1 &#183; Build-DeploymentPlans</text>

  <rect x="516" y="288" width="330" height="72" rx="12" fill="#ffffff" opacity="0.97"/>
  <text x="681" y="333" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#0b6fb8" text-anchor="middle">2 &#183; Deploy-PolicyPlan</text>

  <rect x="516" y="376" width="330" height="72" rx="12" fill="#ffffff" opacity="0.97"/>
  <text x="681" y="421" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#0b6fb8" text-anchor="middle">3 &#183; Deploy-RolesPlan</text>

  <g stroke="#c88719" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M681 272 L681 282"/>
    <path d="M681 360 L681 370"/>
  </g>

  <g stroke="#9fd0f2" stroke-width="6" stroke-linecap="round">
    <line x1="862" y1="315" x2="906" y2="315"/>
  </g>
  <path d="M906 300 L934 315 L906 330 Z" fill="#9fd0f2"/>

  <!-- desired state -->
  <rect x="944" y="250" width="150" height="130" rx="14" fill="#c88719"/>
  <text x="1019" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Desired</text>
  <text x="1019" y="337" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">state</text>

  <text x="600" y="512" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">EPAC and the alternatives</text>
  <text x="600" y="558" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#9fd0f2" text-anchor="middle">EPAC &#183; ALZ &#183; Bicep &#183; Terraform &#183; pick one and commit</text>
</svg>
