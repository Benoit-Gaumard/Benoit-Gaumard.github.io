<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Azure Policy Part 3 - Policy assignments and scope">
  <defs>
    <linearGradient id="pol3bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b6fb8"/>
      <stop offset="100%" stop-color="#17324d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#pol3bg)"/>

  <text x="600" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#9fd0f2" text-anchor="middle" letter-spacing="4">AZURE POLICY &#183; PART 3</text>

  <!-- definition card -->
  <rect x="110" y="240" width="230" height="130" rx="14" fill="#ffffff" opacity="0.97"/>
  <text x="225" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b6fb8" text-anchor="middle">Definition</text>
  <text x="225" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#536f88" text-anchor="middle">inert on its own</text>

  <!-- arrow with label -->
  <g stroke="#9fd0f2" stroke-width="6" stroke-linecap="round">
    <line x1="352" y1="305" x2="432" y2="305"/>
  </g>
  <path d="M432 290 L462 305 L432 320 Z" fill="#9fd0f2"/>
  <text x="405" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#ffdca8" text-anchor="middle">assign</text>

  <!-- scope hierarchy -->
  <rect x="490" y="185" width="600" height="70" rx="12" fill="#ffffff" opacity="0.97"/>
  <text x="530" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d">Management group</text>

  <rect x="540" y="270" width="550" height="70" rx="12" fill="#ffffff" opacity="0.9"/>
  <text x="580" y="313" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d">Subscription</text>

  <rect x="590" y="355" width="500" height="70" rx="12" fill="#ffffff" opacity="0.82"/>
  <text x="630" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d">Resource group</text>

  <!-- inheritance arrows -->
  <g stroke="#c88719" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M512 255 L512 305"/>
    <path d="M562 340 L562 390"/>
  </g>
  <path d="M502 305 L512 322 L522 305 Z" fill="#c88719"/>
  <path d="M552 390 L562 407 L572 390 Z" fill="#c88719"/>

  <text x="600" y="490" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">Policy assignments</text>
  <text x="600" y="538" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#9fd0f2" text-anchor="middle">scope &#183; parameters &#183; enforcementMode &#183; managed identity</text>
</svg>
