<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="What Is an Azure Landing Zone?">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b6fb8"/>
      <stop offset="100%" stop-color="#0f2a45"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.14" stroke="#ffffff" stroke-width="2">
    <path d="M0 520 H1200 M0 440 H1200" />
  </g>
  <!-- hub -->
  <rect x="520" y="260" width="160" height="110" rx="14" fill="#ffffff" opacity="0.95"/>
  <text x="600" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b6fb8" text-anchor="middle">Hub</text>
  <!-- spokes -->
  <g fill="#eef7ff" opacity="0.95">
    <rect x="180" y="120" width="180" height="100" rx="12"/>
    <rect x="180" y="410" width="180" height="100" rx="12"/>
    <rect x="840" y="120" width="180" height="100" rx="12"/>
    <rect x="840" y="410" width="180" height="100" rx="12"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0b6fb8" text-anchor="middle">
    <text x="270" y="176">Identity</text>
    <text x="270" y="466">Connectivity</text>
    <text x="930" y="176">Management</text>
    <text x="930" y="466">Landing Zones</text>
  </g>
  <!-- connectors -->
  <g stroke="#ffffff" stroke-width="4" fill="none" opacity="0.85">
    <path d="M360 170 L520 300"/>
    <path d="M360 460 L520 340"/>
    <path d="M840 170 L680 300"/>
    <path d="M840 460 L680 340"/>
  </g>
</svg>
