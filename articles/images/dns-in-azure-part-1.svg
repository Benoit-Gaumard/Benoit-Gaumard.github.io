<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="DNS in Azure Part 1 - Fundamentals">
  <defs>
    <linearGradient id="dns1bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b6fb8"/>
      <stop offset="100%" stop-color="#17324d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#dns1bg)"/>

  <text x="600" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#9fd0f2" text-anchor="middle" letter-spacing="4">DNS IN AZURE &#183; PART 1</text>

  <!-- VM box -->
  <rect x="130" y="230" width="220" height="130" rx="14" fill="#ffffff" opacity="0.97"/>
  <rect x="160" y="262" width="160" height="10" rx="5" fill="#89afd0"/>
  <rect x="160" y="288" width="120" height="10" rx="5" fill="#c6dbec"/>
  <text x="240" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d" text-anchor="middle">Virtual machine</text>

  <!-- arrow -->
  <g stroke="#9fd0f2" stroke-width="6" stroke-linecap="round">
    <line x1="360" y1="295" x2="470" y2="295"/>
  </g>
  <path d="M470 280 L500 295 L470 310 Z" fill="#9fd0f2"/>

  <!-- VIP box -->
  <rect x="510" y="230" width="300" height="130" rx="14" fill="#c88719"/>
  <text x="660" y="288" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">168.63.129.16</text>
  <text x="660" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#fff3dd" text-anchor="middle">platform virtual IP</text>

  <!-- arrow -->
  <g stroke="#9fd0f2" stroke-width="6" stroke-linecap="round">
    <line x1="820" y1="295" x2="930" y2="295"/>
  </g>
  <path d="M930 280 L960 295 L930 310 Z" fill="#9fd0f2"/>

  <!-- Azure DNS box -->
  <rect x="970" y="230" width="110" height="130" rx="14" fill="#ffffff" opacity="0.97"/>
  <text x="1025" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0b6fb8" text-anchor="middle">Azure</text>
  <text x="1025" y="317" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0b6fb8" text-anchor="middle">DNS</text>

  <text x="600" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">Fundamentals &amp; Azure-provided DNS</text>
  <text x="600" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#9fd0f2" text-anchor="middle">internal.cloudapp.net &#183; DHCP option 15 &#183; VNet DNS settings</text>
