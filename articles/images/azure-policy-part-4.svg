<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Azure Policy Part 4 - Exclusions and notScopes">
  <defs>
    <linearGradient id="pol4bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b6fb8"/>
      <stop offset="100%" stop-color="#17324d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#pol4bg)"/>

  <text x="600" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#9fd0f2" text-anchor="middle" letter-spacing="4">AZURE POLICY &#183; PART 4</text>

  <!-- assignment scope -->
  <rect x="180" y="185" width="840" height="250" rx="18" fill="#0b6fb8" opacity="0.22" stroke="#9fd0f2" stroke-width="3"/>
  <text x="220" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#cfe7fa">Assignment scope</text>

  <!-- in-scope children -->
  <rect x="230" y="262" width="200" height="130" rx="12" fill="#ffffff" opacity="0.97"/>
  <text x="330" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d" text-anchor="middle">Subscription A</text>
  <text x="330" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#157f57" text-anchor="middle">evaluated</text>

  <rect x="450" y="262" width="200" height="130" rx="12" fill="#ffffff" opacity="0.97"/>
  <text x="550" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d" text-anchor="middle">Subscription B</text>
  <text x="550" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#157f57" text-anchor="middle">evaluated</text>

  <!-- excluded child -->
  <rect x="670" y="262" width="290" height="130" rx="12" fill="#2b3a4d" opacity="0.92" stroke="#e4a940" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="815" y="316" font-family="Consolas, Menlo, monospace" font-size="21" font-weight="700" fill="#ffdca8" text-anchor="middle">notScopes</text>
  <text x="815" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#9db3c7" text-anchor="middle">never evaluated &#183; no compliance data</text>

  <!-- strike -->
  <g stroke="#e4a940" stroke-width="5" stroke-linecap="round">
    <line x1="700" y1="292" x2="930" y2="362"/>
  </g>

  <text x="600" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">Exclusions (notScopes)</text>
  <text x="600" y="548" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#9fd0f2" text-anchor="middle">a hole in the scope, not a documented exception</text>
</svg>
