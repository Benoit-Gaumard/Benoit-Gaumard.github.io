<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Azure Policy Part 5 - Policy exemptions">
  <defs>
    <linearGradient id="pol5bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b6fb8"/>
      <stop offset="100%" stop-color="#17324d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#pol5bg)"/>

  <text x="600" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#9fd0f2" text-anchor="middle" letter-spacing="4">AZURE POLICY &#183; PART 5</text>

  <!-- resource -->
  <rect x="130" y="240" width="220" height="130" rx="14" fill="#ffffff" opacity="0.97"/>
  <text x="240" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#17324d" text-anchor="middle">Legacy resource</text>
  <text x="240" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#536f88" text-anchor="middle">still in scope</text>

  <!-- arrow -->
  <g stroke="#9fd0f2" stroke-width="6" stroke-linecap="round">
    <line x1="362" y1="305" x2="422" y2="305"/>
  </g>
  <path d="M422 290 L452 305 L422 320 Z" fill="#9fd0f2"/>

  <!-- shield -->
  <path d="M600 200 L720 240 L720 330 Q720 400 600 435 Q480 400 480 330 L480 240 Z" fill="#c88719"/>
  <text x="600" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Exemption</text>
  <text x="600" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#fff3dd" text-anchor="middle">Waiver / Mitigated</text>
  <text x="600" y="372" font-family="Consolas, Menlo, monospace" font-size="17" fill="#fff3dd" text-anchor="middle">expiresOn</text>

  <!-- arrow -->
  <g stroke="#9fd0f2" stroke-width="6" stroke-linecap="round">
    <line x1="748" y1="305" x2="808" y2="305"/>
  </g>
  <path d="M808 290 L838 305 L808 320 Z" fill="#9fd0f2"/>

  <!-- compliance state -->
  <rect x="856" y="240" width="230" height="130" rx="14" fill="#ffffff" opacity="0.97"/>
  <text x="971" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#0b6fb8" text-anchor="middle">Exempt</text>
  <text x="971" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#536f88" text-anchor="middle">visible &#183; dated &#183; reviewable</text>

  <text x="600" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">Policy exemptions</text>
  <text x="600" y="548" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#9fd0f2" text-anchor="middle">the exception that expires and leaves a trail</text>
</svg>
