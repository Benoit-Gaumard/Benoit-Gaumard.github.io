<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="DNS in Azure Part 3 - Azure DNS Private Resolver">
  <defs>
    <linearGradient id="dns3bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a3ba8"/>
      <stop offset="100%" stop-color="#1a1f4d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#dns3bg)"/>

  <text x="600" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#c9baf5" text-anchor="middle" letter-spacing="4">DNS IN AZURE &#183; PART 3</text>

  <!-- on-premises -->
  <rect x="110" y="215" width="215" height="150" rx="14" fill="#2b2f66" stroke="#c9baf5" stroke-width="3"/>
  <text x="217" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">On-premises</text>
  <text x="217" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#c9baf5" text-anchor="middle">DNS server</text>

  <!-- resolver -->
  <rect x="420" y="190" width="360" height="200" rx="18" fill="#ffffff" opacity="0.97"/>
  <text x="600" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1a1f4d" text-anchor="middle">DNS Private Resolver</text>
  <rect x="450" y="258" width="300" height="52" rx="10" fill="#efeaff"/>
  <text x="600" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#5a3ba8" text-anchor="middle">Inbound endpoint</text>
  <rect x="450" y="322" width="300" height="52" rx="10" fill="#efeaff"/>
  <text x="600" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#5a3ba8" text-anchor="middle">Outbound endpoint</text>

  <!-- azure -->
  <rect x="875" y="215" width="215" height="150" rx="14" fill="#2b2f66" stroke="#c9baf5" stroke-width="3"/>
  <text x="982" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Private zones</text>
  <text x="982" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#c9baf5" text-anchor="middle">&amp; rulesets</text>

  <!-- arrows -->
  <g stroke="#c9baf5" stroke-width="5" stroke-linecap="round">
    <line x1="325" y1="284" x2="410" y2="284"/>
    <line x1="790" y1="348" x2="875" y2="348"/>
    <line x1="790" y1="284" x2="875" y2="284"/>
  </g>

  <text x="600" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">Azure DNS Private Resolver</text>
  <text x="600" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#c9baf5" text-anchor="middle">hybrid resolution &#183; forwarding rulesets &#183; query logging</text>
</svg>
