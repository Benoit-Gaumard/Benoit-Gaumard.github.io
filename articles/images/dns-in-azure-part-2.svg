<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="DNS in Azure Part 2 - Private DNS zones">
  <defs>
    <linearGradient id="dns2bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d7a6c"/>
      <stop offset="100%" stop-color="#12304a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#dns2bg)"/>

  <text x="600" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#9fe3d4" text-anchor="middle" letter-spacing="4">DNS IN AZURE &#183; PART 2</text>

  <!-- central zone -->
  <rect x="470" y="215" width="260" height="150" rx="16" fill="#ffffff" opacity="0.97"/>
  <text x="600" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#12304a" text-anchor="middle">Private DNS zone</text>
  <text x="600" y="312" font-family="Consolas, Menlo, monospace" font-size="24" font-weight="700" fill="#1d7a6c" text-anchor="middle">corp.internal</text>
  <rect x="510" y="330" width="180" height="8" rx="4" fill="#cfe9e3"/>

  <!-- vnets -->
  <rect x="120" y="180" width="230" height="90" rx="12" fill="#0f4a5c" stroke="#9fe3d4" stroke-width="3"/>
  <text x="235" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">VNet hub</text>

  <rect x="120" y="310" width="230" height="90" rx="12" fill="#0f4a5c" stroke="#9fe3d4" stroke-width="3"/>
  <text x="235" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">VNet spoke A</text>

  <rect x="850" y="245" width="230" height="90" rx="12" fill="#0f4a5c" stroke="#9fe3d4" stroke-width="3"/>
  <text x="965" y="299" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">VNet spoke B</text>

  <!-- links -->
  <g stroke="#9fe3d4" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M350 225 C 415 225, 415 270, 470 270"/>
    <path d="M350 355 C 415 355, 415 310, 470 310"/>
    <path d="M730 290 L850 290"/>
  </g>

  <text x="600" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">Azure Private DNS zones</text>
  <text x="600" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#9fe3d4" text-anchor="middle">virtual network links &#183; autoregistration &#183; privatelink zones</text>
</svg>
