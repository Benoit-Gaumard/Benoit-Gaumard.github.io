<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="DNS in Azure Part 4 - Private Link and Private Endpoints">
  <defs>
    <linearGradient id="dns4bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b4531f"/>
      <stop offset="100%" stop-color="#3a1f12"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#dns4bg)"/>

  <text x="600" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#f5cba9" text-anchor="middle" letter-spacing="4">DNS IN AZURE &#183; PART 4</text>

  <!-- consumer vnet -->
  <rect x="95" y="200" width="255" height="185" rx="14" fill="#5c2f18" stroke="#f5cba9" stroke-width="3"/>
  <text x="222" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Your VNet</text>
  <rect x="125" y="272" width="195" height="48" rx="10" fill="#f6ede5"/>
  <text x="222" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#8a3d13" text-anchor="middle">NIC 10.0.1.4</text>
  <text x="222" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#f5cba9" text-anchor="middle">Private Endpoint</text>

  <!-- private link -->
  <rect x="425" y="220" width="350" height="145" rx="18" fill="#ffffff" opacity="0.97"/>
  <text x="600" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#3a1f12" text-anchor="middle">Azure Private Link</text>
  <text x="600" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#8a3d13" text-anchor="middle">no public IP &#183; no gateway</text>
  <text x="600" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#8a3d13" text-anchor="middle">traffic stays on the backbone</text>

  <!-- provider -->
  <rect x="850" y="200" width="255" height="185" rx="14" fill="#5c2f18" stroke="#f5cba9" stroke-width="3"/>
  <text x="977" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">PaaS service</text>
  <rect x="880" y="272" width="195" height="48" rx="10" fill="#f6ede5"/>
  <text x="977" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#8a3d13" text-anchor="middle">Storage / SQL</text>
  <text x="977" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#f5cba9" text-anchor="middle">Private Link service</text>

  <!-- arrows -->
  <g stroke="#f5cba9" stroke-width="5" stroke-linecap="round">
    <line x1="350" y1="292" x2="415" y2="292"/>
    <line x1="785" y1="292" x2="850" y2="292"/>
  </g>

  <text x="600" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">Private Link &amp; Private Endpoints</text>
  <text x="600" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#f5cba9" text-anchor="middle">NICs, sub-resources &#183; service endpoints &#183; approval flow</text>
</svg>
