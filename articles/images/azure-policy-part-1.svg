<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Azure Policy Part 1 - What is an Azure Policy">
  <defs>
    <linearGradient id="pol1bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b6fb8"/>
      <stop offset="100%" stop-color="#17324d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#pol1bg)"/>

  <text x="600" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#9fd0f2" text-anchor="middle" letter-spacing="4">AZURE POLICY &#183; PART 1</text>

  <!-- IF box -->
  <rect x="150" y="220" width="290" height="150" rx="14" fill="#ffffff" opacity="0.97"/>
  <text x="295" y="272" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="700" fill="#0b6fb8" text-anchor="middle">"if"</text>
  <rect x="196" y="296" width="198" height="10" rx="5" fill="#89afd0"/>
  <rect x="196" y="320" width="148" height="10" rx="5" fill="#c6dbec"/>
  <text x="295" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#536f88" text-anchor="middle">the condition</text>

  <!-- arrow -->
  <g stroke="#9fd0f2" stroke-width="6" stroke-linecap="round">
    <line x1="450" y1="295" x2="530" y2="295"/>
  </g>
  <path d="M530 280 L560 295 L530 310 Z" fill="#9fd0f2"/>

  <!-- THEN box -->
  <rect x="570" y="220" width="290" height="150" rx="14" fill="#ffffff" opacity="0.97"/>
  <text x="715" y="272" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="700" fill="#0b6fb8" text-anchor="middle">"then"</text>
  <rect x="616" y="296" width="198" height="10" rx="5" fill="#89afd0"/>
  <rect x="616" y="320" width="118" height="10" rx="5" fill="#c6dbec"/>
  <text x="715" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#536f88" text-anchor="middle">the effect</text>

  <!-- arrow -->
  <g stroke="#9fd0f2" stroke-width="6" stroke-linecap="round">
    <line x1="870" y1="295" x2="930" y2="295"/>
  </g>
  <path d="M930 280 L960 295 L930 310 Z" fill="#9fd0f2"/>

  <!-- Effect chip -->
  <rect x="970" y="245" width="120" height="100" rx="14" fill="#c88719"/>
  <text x="1030" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">Deny</text>

  <text x="600" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">What is an Azure Policy?</text>
  <text x="600" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#9fd0f2" text-anchor="middle">policyRule &#183; aliases &#183; effects &#183; modes</text>
