<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Open-source, metric-compatible substitutes for the Microsoft fonts used in the decks,
     used by the "Publish Slideshow Decks" workflow when LibreOffice renders a .pptx. -->
<fontconfig>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Selawik</family><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Semibold</family><prefer><family>Selawik Semibold</family><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Light</family><prefer><family>Selawik Light</family><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
  <alias binding="same"><family>Calibri</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Calibri Light</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Cambria</family><prefer><family>Caladea</family></prefer></alias>
  <alias binding="same"><family>Aptos</family><prefer><family>Selawik</family><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Aptos Display</family><prefer><family>Selawik</family><family>Noto Sans</family></prefer></alias>
  <alias binding="same"><family>Consolas</family><prefer><family>Cascadia Mono</family><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="same"><family>Cascadia Code</family><prefer><family>Cascadia Mono</family></prefer></alias>
</fontconfig>
